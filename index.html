:root{color-scheme:dark;--bg:#141817;--panel:#1d2220;--line:#383d39;--fg:#efefdf;--muted:#a6ada4;--orange:#ff8a47;--mono:Consolas,'Courier New',monospace;--sans:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC',Arial,sans-serif;--display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--pad:clamp(22px,4.65vw,92px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans)}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #ffa86e;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}button{border:0;background:none}h1,h2,h3,p{margin:0}svg.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}i[data-i]{display:inline-flex;font-style:normal}

using System;
using System.Collections.Generic;
using System.Diagnostics;

using System.IO;

using System.Linq;

    const int MaxBody = 256 * 1024;

    static readonly Dictionary<string, Room> Rooms = new Dictionary<string, Room>(StringComparer.OrdinalIgnoreCase);
    static readonly Dictionary<string, Peer> Tokens = new Dictionary<string, Peer>(StringComparer.Ordinal);
    static readonly UTF8Encoding Utf8 = new UTF8Encoding(false);
    static readonly Stopwatch Uptime = Stopwatch.StartNew();
    static readonly RandomNumberGenerator Random = RandomNumberGenerator.Create();

    static byte[] GamePage;
    [ThreadStatic] static JavaScriptSerializer localJson;
    static JavaScriptSerializer Json { get { return localJson ?? (localJson = new JavaScriptSerializer { MaxJsonLength = MaxBody * 3, RecursionLimit = 24 }); } }

    }
    sealed class Room {
        internal string Name, Map;
        internal Peer Host;
        internal readonly List<Peer> Members = new List<Peer>();
    }
    sealed class Frame {
        internal long Serial;
        internal string Text;
    }
    sealed class Peer {
        internal string Id, Token, Name;
        internal Room Room;
        internal int Batch, Connection;
        internal long LastSeen, Serial;
        internal bool Removed;
        internal readonly Queue<Frame> Frames = new Queue<Frame>();
    }
    static string NewId(int size) {
        var bytes = new byte[size];
        Random.GetBytes(bytes);
        return BitConverter.ToString(bytes).Replace("-", "").ToLowerInvariant();
    }
    static string Field(Dictionary<string, object> obj, string key) {
        object value;
        return obj.TryGetValue(key, out value) ? value as string : null;
    }
    static string Label(Dictionary<string, object> data, string key, int max) {
        string name = White.Replace((Field(data, key) ?? "").Normalize(NormalizationForm.FormKC).Trim(), " ");
        if (name.Length == 0 || name.Length > max * 5 || new StringInfo(name).LengthInTextElements > max ||
            name.Any(ch => Char.IsControl(ch) || (ch >= '\u202A' && ch <= '\u202E') || (ch >= '\u2066' && ch <= '\u2069')))
            throw new Problem(400, key == "room" ? "房间名须为 1–24 个字符。" : "玩家代号须为 1–16 个字符。");
        return name;
    }
    static object Roster(Room room) {
        return room.Members.Select(p => new { id = p.Id, name = p.Name }).ToArray();
    }

        p.Frames.Enqueue(new Frame { Serial = ++p.Serial, Text = json });
        if (p.Frames.Count > 512) p.Frames.Dequeue();
    }
    static void Changed(Room r) {
        string frame = Json.Serialize(new { type = "peers", peers = Roster(r) });

        foreach (Peer other in room.Members) {

            other.Removed = true;

            if (seq != p.Batch+1) throw new Problem(409,"消息顺序异常，请重新加入。");
            var staged=new List<KeyValuePair<Peer,string>>();
            foreach (object obj in (object[])rawMessages) {
                var msg=obj as Dictionary<string,object>;
                object payload, to;
                if (msg==null || !msg.TryGetValue("body",out payload) || !(payload is Dictionary<string,object>))
                    throw new Problem(400,"消息格式错误。");
                if (msg.TryGetValue("to",out to) && to!=null && !(to is string)) throw new Problem(400,"接收者格式错误。");
                string target=p == p.Room.Host ? to as string : p.Room.Host.Id;
                string json=Json.Serialize(new {type="game", from=p.Id, body=payload});
                foreach (var other in p.Room.Members)
                    if (other!=p && (String.IsNullOrEmpty(target) || target==other.Id))
                        staged.Add(new KeyValuePair<Peer,string>(other,json));
            }
            foreach (var item in staged) Publish(item.Key,item.Value);
            p.Batch=seq;
            Monitor.PulseAll(Gate);
            return new {ok=true};
        }
    }
    static void Bytes(Stream output, string s) {
        byte[] bytes=Utf8.GetBytes(s);
        output.Write(bytes,0,bytes.Length);
    }
    static string Status(int code) {
        switch(code) {
            case 200:return "OK"; case 400:return "Bad Request"; case 403:return "Forbidden";
            case 404:return "Not Found"; case 409:return "Conflict"; case 410:return "Gone";
            case 413:return "Content Too Large"; default:return "Server Error";
        }
    }
    static void Reply(Stream output,int code,string mime,byte[] bytes,string extraHeaders = "") {
        Bytes(output,"HTTP/1.1 "+code+" "+Status(code)+"\r\nContent-Type: "+mime+"\r\nContent-Length: "+bytes.Length+
            "\r\nCache-Control: no-store\r\nX-Content-Type-Options: nosniff\r\nReferrer-Policy: no-referrer\r\n"+extraHeaders+"Connection: close\r\n\r\n");
        output.Write(bytes,0,bytes.Length);
    }
    static void JsonReply(Stream stream,int code,object payload) { Reply(stream,code,"application/json; charset=utf-8",Utf8.GetBytes(Json.Serialize(payload))); }
    static void Events(Stream stream,string token,long after) {
        Peer p;
        int connection;
        lock(Gate) { p=Identify(token); connection=++p.Connection; Monitor.PulseAll(Gate); }
        Bytes(stream,"HTTP/1.1 200 OK\r\nContent-Type: text/event-stream; charset=utf-8\r\nCache-Control: no-store\r\nConnection: close\r\n\r\nretry: 700\n: connected\n\n");
        while(true) {
            var result=new StringBuilder();
            bool closed;
            lock(Gate) {
                long due=Uptime.ElapsedMilliseconds+3000;
                while(!p.Removed && p.Serial<=after && p.Connection==connection && Uptime.ElapsedMilliseconds<due)
                    Monitor.Wait(Gate,(int)Math.Max(1,due-Uptime.ElapsedMilliseconds));
                if (p.Connection!=connection) return;
                bool missed=p.Frames.Count>0 && after < p.Frames.Peek().Serial-1;
                closed=p.Removed || missed;
                if (missed) result.Append("data: {\"type\":\"closed\",\"message\":\"连接中断时间过长，请重新加入。\"}\n\n");
                else foreach (var f in p.Frames) if (f.Serial>after) {
                    result.Append("id: ").Append(f.Serial).Append("\ndata: ").Append(f.Text).Append("\n\n"); after=f.Serial;
                }
            }
            Bytes(stream,result.Length==0 ? ": heartbeat\n\n" : result.ToString());
            if (closed) return;
            lock(Gate) p.LastSeen=Uptime.ElapsedMilliseconds;
        }
    }
    static string Line(Stream input,ref int budget) {
        var b=new StringBuilder();
        while(budget-->0) {
            int ch=input.ReadByte();
            if(ch<0) throw new EndOfStreamException();
            if(ch==10) return b.ToString().TrimEnd('\r');
            b.Append((char)ch);
        }
        throw new Problem(400,"请求头过长。");
    }
    static void Handle(TcpClient client) {
        using(client) {
            client.NoDelay=true;
            client.ReceiveTimeout=7000;
            client.SendTimeout=7000;
            Stream stream=client.GetStream();
            try {
                var input=new BufferedStream(stream,4096);
                int budget=16384;
                string[] start=Line(input,ref budget).Split(' ');
                if(start.Length!=3 || !start[1].StartsWith("/")) throw new Problem(400,"请求格式错误。");
                var headers=new Dictionary<string,string>(StringComparer.OrdinalIgnoreCase);
                string line;
                while((line=Line(input,ref budget)).Length>0) {
                    int colon=line.IndexOf(':');
                    if(colon<1) throw new Problem(400,"请求头无效。");
                    headers[line.Substring(0,colon)]=line.Substring(colon+1).Trim();
                }
                string target=start[1], verb=start[0];
                int q=target.IndexOf('?');
                string path=q<0 ? target : target.Substring(0,q);
                if(path=="/api/identity" && (verb=="GET" || verb=="OPTIONS")){
                    var peerEndpoint=(IPEndPoint)client.Client.RemoteEndPoint;
                    string identityOrigin;
                    bool fileProbe=headers.TryGetValue("Origin",out identityOrigin) && identityOrigin=="null" &&
                        IPAddress.IsLoopback(peerEndpoint.Address);
                    string cors=fileProbe ? "Access-Control-Allow-Origin: null\r\nAccess-Control-Allow-Methods: GET\r\nAccess-Control-Allow-Private-Network: true\r\nVary: Origin\r\n" : "";
                    if(verb=="OPTIONS" && !fileProbe)throw new Problem(403,"不允许跨站访问。");
                    byte[] identity=verb=="GET"?Utf8.GetBytes("{\"game\":\"greyport-arena\",\"directPlay\":3}"):new byte[0];
                    Reply(stream,200,"application/json; charset=utf-8",identity,cors);return;
                }
                if(verb=="GET"){
                    if(path=="/api/rooms") {
                        object rooms;
                        lock(Gate) rooms=Rooms.Values.OrderBy(r=>r.Name,StringComparer.OrdinalIgnoreCase)
                            .Select(r=>new {room=r.Name,map=r.Map,count=r.Members.Count,max=Capacity,hostName=r.Host.Name}).ToArray();
                        JsonReply(stream,200,new {rooms,lanUrl=LobbyUrl}); return;
                    }
                    if(path=="/api/events") {
                        string token=q<0 ? null : System.Web.HttpUtility.ParseQueryString(target.Substring(q+1))["token"];
                        long after=0; string last;
                        if(headers.TryGetValue("Last-Event-ID",out last)) Int64.TryParse(last,out after);
                        Events(stream,token,Math.Max(0,after)); return;
                    }
                    if(path=="/" || path=="/index.html" || path=="/pure.html") {
                        Reply(stream,200,"text/html; charset=utf-8",GamePage);return;
                    }
                    throw new Problem(404,"找不到此页面。");
                }
                if(verb!="POST") throw new Problem(400,"不支持此请求。");
                string host,origin;
                if(headers.TryGetValue("Origin",out origin)){
                    Uri uri;
                    if(!Uri.TryCreate(origin,UriKind.Absolute,out uri) || !headers.TryGetValue("Host",out host) ||
                        !String.Equals(uri.Authority,host,StringComparison.OrdinalIgnoreCase))throw new Problem(403,"请在同一大厅页面连接。");
                }
                string sizeText;int size;
                if(!headers.TryGetValue("Content-Length",out sizeText) || !Int32.TryParse(sizeText,out size) || size<1 || size>MaxBody)
                    throw new Problem(413,"消息大小无效。");
                var body=new byte[size];
                for(int pos=0;pos<body.Length;){
                    int n=input.Read(body,pos,body.Length-pos);if(n==0)throw new EndOfStreamException();pos+=n;
                }
                var data=Json.DeserializeObject(Utf8.GetString(body)) as Dictionary<string,object>;
                if(data==null)throw new Problem(400,"消息格式无效。");
                JsonReply(stream,200,Action(path,data));
            } catch(Problem p) { TryError(stream,p.Status,p.Message); }
              catch(ArgumentException) { TryError(stream,400,"名称或数据格式无效。"); }
              catch(InvalidOperationException) { TryError(stream,400,"数据格式无效。"); }
              catch(IOException) { /* the player may have closed the tab */ }
              catch(SocketException) { /* the connection was reset */ }
              catch(Exception) { TryError(stream,500,"大厅暂时无法处理请求。"); }
        }
    }
    static void TryError(Stream stream,int code,string msg) { try { JsonReply(stream,code,new {error=msg}); } catch(IOException){} catch(SocketException){} }
    static IEnumerable<string> Addresses() {
        return NetworkInterface.GetAllNetworkInterfaces()
            .Where(n=>n.OperationalStatus==OperationalStatus.Up && n.NetworkInterfaceType!=NetworkInterfaceType.Loopback)
            .Select(n=>n.GetIPProperties()).OrderByDescending(p=>p.GatewayAddresses.Count>0)
            .SelectMany(p=>p.UnicastAddresses).Select(a=>a.Address)
            .Where(a=>a.AddressFamily==AddressFamily.InterNetwork && !IPAddress.IsLoopback(a)).Select(a=>a.ToString()).Distinct();
    }
    static byte[] LoadGame(string path) {
        if(path!=null){
            byte[] file=File.ReadAllBytes(path);
            if(file.Length>32 && Utf8.GetString(file,0,32).TrimStart('\ufeff').StartsWith("<!DOCTYPE html>",StringComparison.OrdinalIgnoreCase))return file;
            Console.WriteLine("外部文件无法识别为 HTML，使用内置游戏。");
        }
        using(var resource=Assembly.GetExecutingAssembly().GetManifestResourceStream("Greyport.Game.gz")){
            if(resource==null)throw new InvalidDataException("大厅缺少内置游戏资源。");
            using(var zip=new GZipStream(resource,CompressionMode.Decompress))
            using(var result=new MemoryStream()){
                zip.CopyTo(result);return result.ToArray();
            }
        }
    }
    sealed class Listener : IDisposable {
        readonly TcpListener server;
        readonly Timer timer;
        readonly Thread loop;
        volatile bool closed;

        internal Listener(byte[] page, IPAddress bind, int port, bool explicitPort, bool browse, string playPath="/") {
            if(port<1 || port>65535)throw new ArgumentException("端口无效。");
            string[] addresses=bind.Equals(IPAddress.Any)?Addresses().ToArray():new[]{bind.ToString()};
            if(addresses.Length==0)addresses=new[]{"127.0.0.1"};
            int max=explicitPort?port:Math.Min(port+15,65535);
            for(;port<=max;port++){
                try { server=new TcpListener(bind,port);server.ExclusiveAddressUse=true;server.Start(64);break; }
                catch(SocketException){ if(port==max)throw; }
            }
            GamePage=page;
            LobbyUrl="http://"+addresses[0]+":"+port;
            Console.WriteLine("灰港战线 · 局域网对局\n");
            foreach(string address in addresses)Console.WriteLine("对局地址  http://"+address+":"+port+playPath);
            Console.WriteLine("\n所有玩家打开同一个地址即可进场。\n保持本窗口开启。");
            ThreadPool.SetMinThreads(64,16);
            timer=new Timer(delegate{
                lock(Gate) foreach(var p in Tokens.Values.Where(p=>Uptime.ElapsedMilliseconds-p.LastSeen>24000).ToArray())Remove(p);
            },null,4000,4000);
            loop=new Thread(Accept){IsBackground=true};loop.Start();
            if(browse)OpenBrowser((bind.Equals(IPAddress.Any)?"http://127.0.0.1:"+port:LobbyUrl)+playPath);
        }
        void Accept() {
            while(!closed){
                try { var client=server.AcceptTcpClient();ThreadPool.QueueUserWorkItem(_=>Handle(client)); }
                catch(SocketException) { if(!closed) Thread.Sleep(100); }
                catch(ObjectDisposedException) { break; }
            }
        }
        internal void Wait() { loop.Join(); }
        public void Dispose() {
            if(closed)return;
            closed=true;server.Stop();loop.Join();timer.Dispose();
            lock(Gate){
                foreach(var peer in Tokens.Values.ToArray()) Remove(peer);
            }
        }
    }
    // The HTML supplies its own UTF-8 page to the in-box Windows PowerShell host.
    public static IDisposable OpenPage(string html, string address, int port, bool browse) {
        return OpenMatch(html,address,port,browse,"");
    }
    static void OpenBrowser(string url) {
        try {Process.Start(new ProcessStartInfo(url){UseShellExecute=true});}catch(Exception){}
    }
    static bool ExistingService(int port) {
        try {
            var request=(HttpWebRequest)WebRequest.Create("http://127.0.0.1:"+port+"/api/identity");
            request.Proxy=null;request.Timeout=700;request.ReadWriteTimeout=700;request.AllowAutoRedirect=false;
            using(var response=(HttpWebResponse)request.GetResponse())
            using(var reader=new StreamReader(response.GetResponseStream(),Utf8)){
                if(response.ContentLength<1 || response.ContentLength>256)return false;
                var data=Json.DeserializeObject(reader.ReadToEnd()) as Dictionary<string,object>;
                object version;
                return data!=null && Field(data,"game")=="greyport-arena" &&
                    data.TryGetValue("directPlay",out version) && Object.Equals(version,3);
            }
        }catch(WebException){return false;}catch(IOException){return false;}catch(ArgumentException){return false;}
        catch(InvalidOperationException){return false;}
    }
    public static IDisposable OpenMatch(string html, string address, int port, bool browse, string playQuery) {
        if(String.IsNullOrEmpty(html) || !html.StartsWith("<!DOCTYPE html>",StringComparison.OrdinalIgnoreCase))
            throw new InvalidDataException("请选择完整的游戏 HTML 文件。");
        var query=System.Web.HttpUtility.ParseQueryString(playQuery ?? "");
        string room=query["room"]??"灰港",map=query["map"]??"dock";
        if(map!="dock" && map!="rail" && map!="warehouse")map="dock";
        string path="/?room="+Uri.EscapeDataString(room)+"&map="+map;
        if(browse && ExistingService(port)){
            OpenBrowser("http://127.0.0.1:"+port+path);
            Console.WriteLine("已连接本机正在运行的对局服务。");return null;
        }
        try{return new Listener(Utf8.GetBytes(html),IPAddress.Parse(address),port,true,browse,path);}
        catch(SocketException ex) {
            if(ex.SocketErrorCode!=SocketError.AddressAlreadyInUse && ex.SocketErrorCode!=SocketError.AccessDenied)throw;
            if(ExistingService(port)){
                if(browse)OpenBrowser("http://127.0.0.1:"+port+path);
                Console.WriteLine("已连接本机正在运行的对局服务。");return null;
            }
            throw new InvalidOperationException("端口 "+port+" 正在使用中。若正在运行旧版灰港，请在原 PowerShell 窗口按回车结束联机，再运行新版启动命令。",ex);
        }
    }
    static int Main(string[] args) {
        Console.OutputEncoding=Utf8;
        try {
            int port=8787; bool browse=true,explicitPort=false; IPAddress bind=IPAddress.Any;
            string gamePath=null;
            for(int i=0;i<args.Length;i++) {
                switch(args[i]) {
                    case "--port":port=Int32.Parse(args[++i]);explicitPort=true;break;
                    case "--bind":bind=IPAddress.Parse(args[++i]);break;
                    case "--html":gamePath=Path.GetFullPath(args[++i]);break;
                    case "--no-browser":browse=false;break;
                    default:throw new ArgumentException("未知参数："+args[i]);
                }
            }
            using (var service = new Listener(LoadGame(gamePath),bind,port,explicitPort,browse))service.Wait();
            return 0;
        } catch(Exception ex) {
            Console.Error.WriteLine(ex.Message);
            if(args.Length==0 && Environment.UserInteractive){Console.WriteLine("按回车键退出。");Console.ReadLine();}
            return 1;
        }
    }
}

<script>(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const mat = {
    iron: '#424c52', plate: '#677174', light: '#87908f', black: '#333b40',
    dark: '#242d33', grip: '#374145', stripe: '#eca83c', bone: '#b9c3be',
    blue: '#558d9c', glass: '#7acacf', suit: '#505b5b', cuff: '#343f43',
    glove: '#323c42', knuckle: '#485357', brass: '#d0a259'
  };
  const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const unit = a => { const n = Math.hypot(...a) || 1; return a.map(v => v/n); };
  const clamp = (x,lo,hi) => Math.max(lo,Math.min(hi,x));
  const mix = (a,b,t) => a+(b-a)*t;
  const parsed = new Map();
  function color(base) {
    if (!parsed.has(base)) parsed.set(base,[1,3,5].map(i=>parseInt(base.slice(i,i+2),16)));
    return parsed.get(base);
  }
  function rig(index) {
    const faces=[];
    let group='gun';
    function face(vertices, outward, base, edge=false, label=null) {
      let n=unit(cross(sub(vertices[1],vertices[0]),sub(vertices[2],vertices[0])));
      if(dot(n,outward)<0) n=n.map(k=>-k);
      faces.push({vertices,n,base:color(base),edge,group,label});
    }
    // A body section is a bevelled side profile extruded across the chassis.
    function profile(x,w,outline,base,edge=true) {
      const a=outline.map(([z,y])=>[x-w/2,y,z]), b=outline.map(([z,y])=>[x+w/2,y,z]);
      face(a,[-1,0,0],base,edge); face(b,[1,0,0],base,edge);
      const mid=outline.reduce((m,[z,y])=>[m[0]+z/outline.length,m[1]+y/outline.length],[0,0]);
      for(let i=0;i<a.length;i++){
        const j=(i+1)%a.length;
        face([a[i],a[j],b[j],b[i]], [0,(a[i][1]+a[j][1])/2-mid[1],(a[i][2]+a[j][2])/2-mid[0]],base,edge);
      }
    }
    function box(x,y,z,w,h,d,c,bevel=.015,edge=true) {
      const z0=z-d/2,z1=z+d/2,y0=y-h/2,y1=y+h/2,t=Math.min(bevel,h*.35,d*.35);
      const outline=t ? [[z0+t,y0],[z1-t,y0],[z1,y0+t],[z1,y1-t],[z1-t,y1],[z0+t,y1],[z0,y1-t],[z0,y0+t]] :
        [[z0,y0],[z1,y0],[z1,y1],[z0,y1]];
      profile(x,w,outline,c,edge);
    }
    // Tapered octagonal tubing also forms cuffs and padded sleeves.
    function tube(a,b,r1,r2,base,segments=8,edge=false) {
      const axis=unit(sub(b,a)), v=unit(cross(axis,Math.abs(axis[1])>.95?[1,0,0]:[0,1,0])), u=cross(axis,v);
      const start=[], end=[], normals=[];
      for(let i=0;i<segments;i++){
        const t=TAU*(i+.5)/segments, n=v.map((k,j)=>k*Math.cos(t)+u[j]*Math.sin(t));
        normals.push(n); start.push(a.map((k,j)=>k+n[j]*r1)); end.push(b.map((k,j)=>k+n[j]*r2));
      }
      face(start,axis.map(k=>-k),base,edge); face(end,axis,base,edge);
      for(let i=0;i<segments;i++){
        const j=(i+1)%segments;
        face([start[i],start[j],end[j],end[i]], normals[i].map((k,l)=>k+normals[j][l]),base,edge);
      }
    }
    function barrel(z0,z1,r,c,y=.055){tube([0,y,z0],[0,y,z1],r,r,c,10);}
    function sides(y,z,w,h,d,c){
      for(const s of [-1,1]) box(s*w/2,y,z,.009,h,d,c,0,false);
    }
    function text(x,y,z,h,d,str) {
      const s=Math.sign(x);
      const vertices=[[x,y+h/2,z-s*d/2],[x,y+h/2,z+s*d/2],[x,y-h/2,z+s*d/2],[x,y-h/2,z-s*d/2]];
      face(vertices,[s,0,0],mat.bone,false,str);
    }
    function bolt(y,z,w) {
      for(const s of [-1,1]){
        tube([s*w/2,y,z],[s*(w/2+.012),y,z],.026,.024,mat.dark,6);
        box(s*(w/2+.015),y,z,.004,.007,.030,mat.light,0,false);
      }
    }
    function optical(y,z,small=false){
      const width=small?.19:.28, height=small?.13:.205;
      box(0,y-.025,z,width+.027,.068,.22,mat.dark);
      box(0,y+.015,z,width,.036,.15,mat.iron,.007);
      for(const s of [-1,1]){
        box(s*(width/2-.015),y+height/2,z,.034,height,.15,mat.black,.016);
        box(s*(width/2-.015),y+height*.86,z-.076,.017,.026,.008,mat.glass,0);
      }
      box(0,y+height,z,width-.018,.035,.145,mat.iron,.01);
      return y+height*.52;
    }
    let tip, eye, rear, supportZ;
    if(index===0){

  // Shapes are tessellated once at startup. Adjacent fabric rings share vertices and normals.
  function operatorBuilder(distant=false) {
    const data=[], indices=[];
    let joint=0;
    function vertex(p,n,col,material) {
      const index=data.length/11;
      data.push(...p,...n,...col,material,joint);
      return index;
    }
    function polygon(points,col,material=11,normal) {
      if(points.length<3)return;
      const n=normal||norm(cross(sub(points[1],points[0]),sub(points[2],points[0])));
      const first=vertex(points[0],n,col,material);
      let prev=vertex(points[1],n,col,material);
      for(let i=2;i<points.length;i++){
        const next=vertex(points[i],n,col,material);indices.push(first,prev,next);prev=next;
      }
    }
    function loft(rings,col,sides=14,material=11) {
      if(distant)sides=Math.min(sides,9);
      const start=data.length/11;
      const cap0=[],cap1=[];
      for(let row=0;row<rings.length;row++){
        const [x,y,z,rx,rz,tiltX=0,tiltZ=0]=rings[row],lo=rings[Math.max(0,row-1)],hi=rings[Math.min(row+1,rings.length-1)];
        for(let i=0;i<sides;i++){
          const a=i*2*Math.PI/sides,cs=Math.cos(a),sn=Math.sin(a);
          const dy=hi[1]-lo[1]+cs*((hi[5]||0)-(lo[5]||0))+sn*((hi[6]||0)-(lo[6]||0));
          const normal=norm(cross([hi[0]-lo[0]+cs*(hi[3]-lo[3]),dy,hi[2]-lo[2]+sn*(hi[4]-lo[4])],[-rx*sn,-tiltX*sn+tiltZ*cs,rz*cs]));
          const p=[x+rx*cs,y+tiltX*cs+tiltZ*sn,z+rz*sn];vertex(p,normal,col,material);
          if(row===0)cap0.push(p);
          if(row===rings.length-1)cap1.push(p);
          if(row>0){
            const lower=start+(row-1)*sides+i,adj=start+(row-1)*sides+(i+1)%sides;
            indices.push(lower,lower+sides,adj+sides,lower,adj+sides,adj);
          }
        }
      }
      polygon(cap0,col,material,[0,-1,0]);polygon(cap1,col,material,[0,1,0]);
    }
    function ell(x,y,z,rx,ry,rz,col,material=11,sides=12,stacks=7) {
      if(distant&&Math.max(rx,ry,rz)<.010)return;
      if(distant)stacks=Math.min(stacks,4);
      const rings=[];
      for(let j=0;j<=stacks;j++){
        const lat=Math.PI*(j/stacks-.5),r=Math.max(.0001,Math.cos(lat));
        rings.push([x,y+ry*Math.sin(lat),z,rx*r,rz*r]);
      }
      loft(rings,col,sides,material);
    }
    function cuboid(x,y,z,w,h,d,col,material=11) {
      const points=[];
      for(let k=0;k<8;k++)points.push([x+(k&1?w:-w)/2,y+(k&2?h:-h)/2,z+(k&4?d:-d)/2]);
      for(const [is,n] of [[[0,1,3,2],[0,0,-1]],[[4,6,7,5],[0,0,1]],[[0,2,6,4],[-1,0,0]],[[1,5,7,3],[1,0,0]],[[0,4,5,1],[0,-1,0]],[[2,3,7,6],[0,1,0]]]){
        polygon(is.map(i=>points[i]),col,material,n);
      }
    }
    function cylinder(a,b,r,col,material=11,sides=8) {

    g.translate(state.x,state.z);g.rotate(state.yaw||0);g.beginPath();g.moveTo(0,-2.3);g.lineTo(1.5,1.8);g.lineTo(0,1.1);g.lineTo(-1.5,1.8);g.closePath();g.fillStyle='#ffdc9e';g.fill();
  }
  g.restore();
  if(!radar){
    g.fillStyle='#b4c1ac';g.strokeStyle='#a9bba5';g.font='9px Consolas,monospace';g.textAlign='center';g.fillText('N',w-18,15);
    g.save();g.translate(w-18,24);g.rotate(angle);g.beginPath();g.moveTo(0,-5);g.lineTo(-3,5);g.lineTo(0,2);g.lineTo(3,5);g.closePath();g.stroke();g.restore();
    if(!compact){const end=12+scale*5;g.textAlign='left';g.beginPath();g.moveTo(12,h-14);g.lineTo(12,h-10);g.lineTo(end,h-10);g.lineTo(end,h-14);g.stroke();g.fillText('5 m',end+5,h-8)}
  }
}

(() => {
  'use strict';

  function stored(key,fallback){try{return localStorage.getItem('greyport.'+key)??fallback}catch{return fallback}}
  function store(key,value){try{localStorage.setItem('greyport.'+key,value)}catch{}}
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  dlg.addEventListener('click',e=>{if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()});
  if(stored('sound','on')==='off')Game.setSound(false);
  function help(){

    showModal('help','FIELD MANUAL','操作指南','<div class="keylist">'+keys.map(([a,b])=>'<div>'+a+'<kbd>'+b+'</kbd></div>').join('')+'</div><p style="margin-top:16px">第一次点击画面后，移动鼠标转动视角。手枪每次点击打一发，持刀时每次点击挥一次。阵亡后 15 秒自动复活。</p>');
  }
  function armory(selected){

      [['弹匣容量',g.cap+' 发'],['基础伤害',g.damage],['射击模式',selected===0?'单发 / 连发':'单发'],
      ['射速上限',Math.round(60/(selected===0?g.delay:g.semiDelay))+' 发/分'],

    body.querySelectorAll('[data-gun]').forEach(b=>b.onclick=()=>armory(Number(b.dataset.gun)));

  function refreshPreview(){

    text('mapSize',previewMap.width+' × '+previewMap.depth+' m');

      const selected=b.dataset.map===previewMap.id;
      b.classList.toggle('chosen',selected);b.setAttribute('aria-pressed',selected);
    }
    drawMap(large,null,false,previewMap);
  }
  function maps(){
    previewMap=Arena.map;
    showModal('map','MAP INTEL',previewMap.name,
      '<div class="seg mapnav" role="group" aria-label="浏览地图">'+Arena.maps.map(m=>'<button type="button" data-map="'+esc(m.id)+'">'+esc(m.name)+'</button>').join('')+'</div>'
      +'<canvas id="largePlot" class="largeplot" role="img"></canvas><p class="legend"><span>●</span> 出生点　▧ 障碍物</p><p class="mapdesc" id="mapDescription"></p>'
      +'<div class="briefstats"><span>场地尺寸<b id="mapSize"></b></span><span>对局时长<b>5 分钟</b></span><span>复活间隔<b>15 秒</b></span></div>');

      const choice=e.target.closest('[data-map]');
      if(choice){previewMap=getMap(choice.dataset.map);refreshPreview()}

  };
  function roomLabel(){
    if(!LAN.active)return '';
    return LAN.localOnly?LAN.room+' · 本机对局':LAN.room+' · '+LAN.peers.length+' / 8 人';
  }
  function rememberRoute(){
    target={room:LAN.room,map:LAN.map};
    if(location.protocol==='file:')return;
    const url=new URL(location.href);
    url.searchParams.set('room',target.room);url.searchParams.set('map',target.map);url.hash='';
    history.replaceState(null,'',url.href);
  }
  function action(label,handler,primary=false,id=''){
    const button=document.createElement('button');
    button.type='button';button.className='bt'+(primary?' primary':'');button.textContent=label;
    if(id)button.id=id;
    button.onclick=handler;$('matchActions').append(button);
  }

    $('matchOverlay').hidden=false;text('matchEn',en);text('matchTitle',title);text('matchText',message);
    $('matchMore').replaceChildren();$('matchActions').replaceChildren();
  }
  function disconnected(message){
    document.body.dataset.screen='menu';$('entryStatus').hidden=true;
    overlay('MATCH','进入对局',message||'已离开 '+target.room+'。');
    action('重新进入',()=>enter(target),true,'rejoinMatch');
    action('另开对局',newMatch,false,'newMatch');
  }
  async function enter(route,create=false,name=player){
    if(joining)return;
    joining=true;
    try{
      if(create)await LAN.createRoom(route.room,name,route.map);
      else await LAN.enterRoom(route.room,name,route.map);
      rememberRoute();closeModal();
      if(!Game.start({name,weapon:equipped})){
        Game.quit();LAN.leave();disconnected('场景加载失败。请使用支持 WebGL 的桌面浏览器后重试。');return;
      }
      player=name;if(create)store('name',name);
      text('radarMap',Arena.map.name);text('roomtag',roomLabel());$('killfeed').replaceChildren();
      $('entryStatus').hidden=true;
    }catch(e){
      const message=e.message||'连接失败，请重试。';
      if(create&&dlg.open&&$('matchError'))text('matchError',message);
      else if(Game.state)notify(message);
      else disconnected(message);
    }finally{joining=false;if($('createRoom'))$('createRoom').disabled=false}
  }
  function newMatch(){
    const current=LAN.active?LAN.room:target.room;
    const defaultRoom=('战区 '+Math.random().toString(36).slice(2,6).toUpperCase());
    const activeMap=LAN.map||target.map;
    showModal('new','NEW MATCH','另开对局','<form id="newMatchForm">'
      +'<label class="field">玩家代号<input id="playername" maxlength="16" required value="'+esc(player)+'" autocomplete="nickname"></label>'
      +'<label class="field">对局名称<input id="newRoomName" maxlength="24" required value="'+esc(defaultRoom)+'" autocomplete="off"></label>'
      +'<label class="field">地图<select id="roomMap">'+Arena.maps.map(m=>'<option value="'+esc(m.id)+'"'+(m.id===activeMap?' selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select></label>'
      +(!LAN.localOnly&&LAN.active&&LAN.id===LAN.hostId&&LAN.peers.length>1?'<p class="smallnote">切换后，你主持的「'+esc(current)+'」将结束。</p>':'')
      +'<p class="formerr" id="matchError" role="alert"></p><button type="submit" id="createRoom" class="bt primary">进入新对局</button></form>');
    $('newMatchForm').onsubmit=e=>{
      e.preventDefault();if(joining)return;
      const room=$('newRoomName').value.trim(),name=$('playername').value.trim();
      if(!name||!room){text('matchError','请填写对局名称和玩家代号。');return}
      $('createRoom').disabled=true;
      void enter({room,map:$('roomMap').value},true,name);
    };
  }
  async function copyField(field,success){
    const status=$('copyStatus');
    try{await navigator.clipboard.writeText(field.value);status.textContent=success;return}catch{}
    field.closest('details')?.setAttribute('open','');field.focus();field.select();
    try{if(document.execCommand('copy')){status.textContent=success;return}}catch{}
    status.textContent='内容已选中，按 Ctrl+C 复制。';
  }
  function share(){
    const url=LAN.shareUrl;
    if(url){
      showModal('share','LOCAL NETWORK','分享对局',
        '<section class="sharing"><p>同一局域网的玩家打开这个地址，即可进入「'+esc(LAN.room)+'」。</p>'
        +'<label class="field">对局地址<input id="shareAddress" readonly></label><button type="button" class="bt primary" id="copyAddress">复制对局地址</button>'
        +'<p role="status" id="copyStatus"></p></section>');
      const field=$('shareAddress');field.value=url;
      $('copyAddress').onclick=()=>copyField(field,'对局地址已复制。');void copyField(field,'对局地址已复制。');
    }else if(LAN.localOnly){
      showModal('share','LOCAL NETWORK','让好友加入',
        '<section class="sharing"><p>在这台 Windows 电脑的 PowerShell 中运行下方命令，浏览器会打开可联机的同名对局。好友用浏览器打开窗口显示的局域网地址即可加入。</p>'
        +'<div class="rowactions"><button type="button" class="bt primary" id="copyHostCommand">复制启动命令</button></div><details><summary>查看命令</summary>'
        +'<textarea id="hostCommand" readonly rows="4" aria-label="联机启动命令"></textarea></details><p role="status" id="copyStatus"></p></section>');
      const field=$('hostCommand');field.value=SingleFileHost.command(LAN.room||target.room,LAN.map||target.map);
      $('copyHostCommand').onclick=()=>copyField(field,'已复制。请粘贴到 Windows PowerShell 后按回车。');
    }else{
      showModal('share','LOCAL NETWORK','分享对局',
        '<p>当前服务未提供其他电脑可以访问的局域网地址。请在连接局域网的 Windows 主机上打开本地游戏文件，从「分享对局」启用联机。</p>');
    }
  }
  function feed(message){const line=document.createElement('div');line.textContent=message;const feed=$('killfeed');feed.append(line);if(feed.children.length>4)feed.firstChild.remove();setTimeout(()=>line.remove(),3200)}
  function elimination(name){text('defeatedName',name)}
  let shownTarget=null,targetTimer=0;
  function vitals(hp,kills,deaths,target){
    text('kills',kills);text('deaths',deaths);text('hp',Math.ceil(hp));$('hpbar').style.width=Math.max(0,hp)+'%';
    if(target===shownTarget)return;
    clearTimeout(targetTimer);shownTarget=target;

  }
  const slotLabels=[...$('weaponSlots').children];
  let activeSlot=-1;
  function hud(s){
    lastState=s;
    $('fieldHint').hidden=Boolean(s.controlsEngaged);

      action('另开对局',newMatch,true,'newMatch');action('离开对局',()=>Game.quit());
    }
  }
  $('pause').onclick=()=>Game.pause();$('shareMatch').onclick=share;
  LAN.onPeers(()=>{text('roomtag',roomLabel());if(document.body.dataset.screen==='paused')text('matchText',Arena.map.name+' · '+roomLabel())});
  window.UI={screen,hud,vitals,notify,feed,elimination};
  window.addEventListener('resize',()=>{if($('largePlot'))refreshPreview();if($('gunPreview'))Weapon.preview($('gunPreview'),Number(body.querySelector('.chosen')?.dataset.gun??0))});
  void enter(target).then(async()=>{
    if(!LAN.localOnly)return;
    const origin=await LAN.probeLocalHost();
    if(origin&&LAN.localOnly)location.replace(LAN.playUrl(origin,LAN.room,LAN.map));
  });
})();
</script>
